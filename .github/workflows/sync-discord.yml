name: Sync WW2 modlist to Discord

on:
  push:
    branches: [main]
    paths:
      - 'Misfits WW2.html'
      - '.github/workflows/sync-discord.yml'
      - '.github/discord-modlist-message.md'
      - '.github/discord-dlc-compatibility.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the message without contacting Discord
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: discord-modlist-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preview or edit Discord message
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from decimal import Decimal
          from http.client import HTTPException
          from datetime import datetime, timezone
          from pathlib import Path
          from html.parser import HTMLParser
          from string import Template
          from uuid import uuid4

          preset = Path("Misfits WW2.html")
          state = Path(".github/discord-ww2-message-id.txt")
          class DlcParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.names = []
                  self.in_dlc = False
                  self.name_parts = None

              def handle_starttag(self, tag, attrs):
                  kind = dict(attrs).get("data-type")
                  if tag == "tr":
                      self.in_dlc = kind == "DlcContainer"
                  elif tag == "td" and self.in_dlc and kind == "DisplayName":
                      self.name_parts = []

              def handle_endtag(self, tag):
                  if tag == "td" and self.name_parts is not None:
                      name = " ".join("".join(self.name_parts).split())
                      if name and name not in self.names:
                          self.names.append(name)
                      self.name_parts = None
                  elif tag == "tr":
                      self.in_dlc = False

              def handle_data(self, data):
                  if self.name_parts is not None:
                      self.name_parts.append(data)

          preset_bytes = preset.read_bytes()
          html = preset_bytes.decode("utf-8-sig")
          parser = DlcParser()
          parser.feed(html)
          parser.close()

          ids = set(re.findall(
              r"steamcommunity\.com/sharedfiles/filedetails/"
              r"\?(?:[^\"'<>\s]*?&amp;)?id=(\d+)", html
          ))
          if not ids:
              raise SystemExit("No Workshop IDs found. Check the preset export.")

          # This map is the shared, maintainer-reviewed list of compatibility links.
          links = json.loads(Path(".github/discord-dlc-compatibility.json").read_text(encoding="utf-8"))
          if not isinstance(links, dict) or any(
              not isinstance(url, str) or not re.fullmatch(
                  r"https://steamcommunity\.com/sharedfiles/filedetails/\?id=[1-9][0-9]*", url
              )
              for url in links.values()
          ):
              raise SystemExit("Compatibility links must use canonical Steam Workshop URLs.")

          def escape_name(name):
              return re.sub(r"([\\\x60*_{}\[\]()<>#+.!|~])", r"\\\1", name)

          dlc_lines = [
              f"- {escape_name(name)}" + (
                  f" ([Compatibility data for non-owners]({links[name]}))" if name in links else ""
              )
              for name in parser.names
          ]
          class WorkshopPage(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
                  self.hidden = False

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.hidden = True

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.hidden = False

              def handle_data(self, data):
                  if not self.hidden:
                      self.text.append(data)

          def workshop_size(item_id):
              url = f"https://steamcommunity.com/sharedfiles/filedetails/?id={item_id}&l=english"
              request = urllib.request.Request(url, headers={"User-Agent": "Misfits-Modlist-Sync/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=6) as response:
                      page = response.read(2_000_001)
              except (OSError, HTTPException):
                  return None
              if len(page) > 2_000_000:
                  return None
              parser = WorkshopPage()
              parser.feed(page.decode("utf-8", errors="replace"))
              parser.close()
              match = re.search(
                  r"\bFile Size\s+(?:(?:Posted|Updated)\s+){0,2}"
                  r"([0-9]+(?:\.[0-9]+)?)\s*(B|KB|MB|GB|TB)\b",
                  " ".join(" ".join(parser.text).split()),
              )
              if not match:
                  return None
              amount, unit = match.groups()
              return Decimal(amount) * 1000 ** ("B", "KB", "MB", "GB", "TB").index(unit)

          def estimate_size(item_ids):
              with ThreadPoolExecutor(max_workers=8) as pool:
                  sizes = [size for size in pool.map(workshop_size, sorted(item_ids)) if size is not None]
              if not sizes:
                  return "unavailable (Steam reported no sizes)"
              total_gb = sum(sizes) / 10**9
              amount = f"~{total_gb:,.1f} GB" if total_gb >= Decimal("0.1") else "<0.1 GB"
              if len(sizes) < len(item_ids):
                  return f"{amount} subtotal ({len(sizes)}/{len(item_ids)} mods reported)"
              return amount

          template = Template(Path(".github/discord-modlist-message.md").read_text(encoding="utf-8"))
          try:
              description = template.substitute(
                  modlist_name=preset.stem,
                  mod_count=len(ids),
                  workshop_size=estimate_size(ids),
                  updated_date=datetime.now(timezone.utc).strftime("%d %B %Y"),
                  dlc_list="\n".join(dlc_lines) or "None listed in the preset.",
              ).strip()
          except (ValueError, KeyError):
              raise SystemExit("Invalid placeholder in the Discord message template.") from None
          if not 0 < len(description.encode("utf-16-le")) // 2 <= 4096:
              raise SystemExit("The Discord container text must contain 1–4096 characters.")

          message_id = state.read_text(encoding="utf-8").strip() if state.is_file() else ""
          if not re.fullmatch(r"[0-9]{17,20}", message_id):
              raise SystemExit("Missing or invalid saved Discord message ID. Restore the tracked ID.")

          message = {
              "content": None,
              "embeds": None,
              "flags": 1 << 15,
              "components": [{
                  "type": 17,
                  "accent_color": 0xC0392B,
                  "components": [
                      {"type": 10, "content": description},
                      {"type": 13, "file": {"url": f"attachment://{preset.name}"}},
                  ],
              }],
              "allowed_mentions": {"parse": []},
              "attachments": [{"id": 0, "filename": preset.name}],
          }
          if os.environ.get("DRY_RUN") == "true":
              print(json.dumps(message, ensure_ascii=False, indent=2))
              print(f"Would edit message {message_id} with {len(preset_bytes)} attachment bytes.")
              raise SystemExit(0)

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip().rstrip("/")
          if not re.fullmatch(
              r"https://(?:discord\.com|discordapp\.com)/api/(?:v[0-9]+/)?webhooks/[0-9]+/[A-Za-z0-9_-]+",
              webhook,
          ):
              raise SystemExit("DISCORD_WEBHOOK_URL is missing or invalid.")
          endpoint = f"{webhook}/messages/{message_id}?with_components=true"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          boundary = uuid4().hex
          body = bytearray()

          def part(name, content, filename=None, content_type=None):
              body.extend(f"--{boundary}\r\n".encode())
              disposition = f'form-data; name="{name}"'
              if filename:
                  disposition += f'; filename="{filename}"'
              body.extend(
                  f"Content-Disposition: {disposition}\r\n".encode()
              )
              if content_type:
                  body.extend(
                      f"Content-Type: {content_type}\r\n".encode()
                  )
              body.extend(b"\r\n")
              body.extend(content)
              body.extend(b"\r\n")

          part(
              "payload_json",
              json.dumps(message).encode(),
              content_type="application/json"
          )
          part(
              "files[0]",
              preset_bytes,
              filename=preset.name,
              content_type="application/octet-stream"
          )
          body.extend(f"--{boundary}--\r\n".encode())

          request = urllib.request.Request(
              endpoint,
              data=bytes(body),
              headers={
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
                  "User-Agent": "Misfits-Modlist-Sync/1.0"
              },
              method="PATCH"
          )

          try:
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord rejected the edit (HTTP {error.code}). Check the webhook and saved ID.") from None
          except (OSError, ValueError):
              raise SystemExit("Could not confirm the Discord edit. Check Discord and retry if needed.") from None

          if not isinstance(result, dict) or result.get("id") != message_id:
              raise SystemExit("Discord returned an unexpected message ID.")
          if not result.get("flags", 0) & (1 << 15) or not result.get("components"):
              raise SystemExit("Discord did not confirm the container layout.")
          print(f"Discord message synced. Workshop mods: {len(ids)}")
          PY
