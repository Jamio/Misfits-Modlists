name: Sync Discord modlists

on:
  push:
    branches: [main]
    paths:
      - 'Misfits WW2.html'
      - '.github/ww2-banner.png'
      - 'modpacks/*/*.html'
      - 'modpacks/*/banner.png'
      - '.github/discord-modlist-message.md'
      - '.github/discord-dlc-compatibility.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the message without contacting Discord
        type: boolean
        default: true
      pack:
        description: Pack folder name, or ww2 for the original pack
        type: string
        default: ww2

permissions:
  contents: read

concurrency:
  group: discord-modlist-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}
          persist-credentials: false
      - name: Preview or edit one registered pack
        if: github.event_name == 'workflow_dispatch'
        env:
          PACK: ${{ inputs.pack }}
          MODE: ${{ inputs.dry_run && 'preview' || 'update' }}
          DISCORD_WEBHOOK_URL: ${{ !inputs.dry_run && secrets.DISCORD_WEBHOOK_URL || '' }}
        run: python3 .github/sync-discord.py "$PACK" "$MODE"
      - name: Refresh registered cards
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          status=0
          python3 .github/sync-discord.py ww2 update || status=1
          for state in modpacks/*/discord-message-id.txt; do
            [[ -f "$state" ]] || continue
            grep -Eq '^[0-9]{17,20}$' "$state" || continue
            pack=${state%/*}
            python3 .github/sync-discord.py "${pack##*/}" update || status=1
          done
          exit "$status"
